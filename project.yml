name: FinanzasDaniel
options:
  bundleIdPrefix: com.finanzasdaniel
targets:
  FinanzasDaniel:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources: [FinanzasDaniel]
    info:
      path: FinanzasDaniel/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      ENABLE_PREVIEWS: YES
      SWIFT_VERSION: 5.9
    dependencies:
      - sdk: SwiftUI.framework
      - sdk: SwiftData.framework
      - sdk: AppIntents.framework
      - sdk: UserNotifications.framework
  FinanzasDanielTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources: [FinanzasDanielTests]
    dependencies:
      - target: FinanzasDaniel
    settings:
      SWIFT_VERSION: 5.9
      GENERATE_INFOPLIST_FILE: YES
schemes:
  FinanzasDaniel:
    build:
      targets:
        FinanzasDaniel: [run, test, profile, analyze, archive]
        FinanzasDanielTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FinanzasDanielTests
    profile:
      config: Release
